# Static issue guidance only; never check out or execute issue-supplied code.
name: New Issue Guidance

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  guide:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post guidance comment on new issue
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Please include your Site Optimizer, WordPress and PHP versions,
            whether this is multisite, the affected setting, and reproducible steps.

            Remove credentials, private domains and other sensitive data from examples.
            Report security vulnerabilities through the private process in SECURITY.md.
