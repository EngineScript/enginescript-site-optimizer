            verify_phpmd_xml_content=${{ steps.verify_phpmd_xml_content.outcome }}
            run_phpmd=${{ steps.run_phpmd.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-optimizer-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-optimizer-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-optimizer-diagnostics/run.txt"
