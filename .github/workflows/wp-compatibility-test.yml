  wp-version-test:
    name: Test WordPress ${{ matrix.wp-version }} with PHP ${{ matrix.php-version }} (${{ matrix.dependency-versions }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        wp-version: ['6.8', 'latest', 'nightly']
        dependency-versions: ['highest']
        include:
          - php-version: '8.2'
            wp-version: 'latest'
            dependency-versions: 'lowest'
      fail-fast: false

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        id: setup_php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Use isolated Composer auth
        id: use_isolated_composer_auth
        run: |
          # Avoid inheriting a masked or malformed GitHub OAuth token from Composer auth.
          composer_home="${RUNNER_TEMP}/composer-home"
          composer_cache="${RUNNER_TEMP}/composer-cache"

          mkdir -p "$composer_home" "$composer_cache"

          {
            echo "COMPOSER_HOME=$composer_home"
            echo "COMPOSER_CACHE_DIR=$composer_cache"
            echo 'COMPOSER_AUTH={"github-oauth":{"github.com":"${{ github.token }}"}}'
          } >> "$GITHUB_ENV"

      - name: PHP syntax lint
        id: php_syntax_lint
        run: |
          find . \
            -path './vendor' -prune -o \
            -path './tests' -prune -o \
            -path './build' -prune -o \
            -path './plugin-check-build' -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Subversion
        id: install_subversion
        timeout-minutes: 15
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        id: install_composer_dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependency-versions }}
          composer-options: "--prefer-dist --no-progress"

      - name: Run isolated unit tests
        id: run_isolated_unit_tests
        run: |
          mkdir -p "$RUNNER_TEMP/es-optimizer-diagnostics"
          php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-optimizer-diagnostics/unit-dependencies.txt"
          composer test -- --log-junit "$RUNNER_TEMP/es-optimizer-diagnostics/unit-junit.xml"
          if composer test -- --do-not-cache-result --filter '__es_optimizer_intentionally_no_matching_test__' > "$RUNNER_TEMP/optimizer-unit-empty.txt" 2>&1; then
            echo '::error::An empty unit suite incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'No tests executed' "$RUNNER_TEMP/optimizer-unit-empty.txt"
          fi
          cat > "$RUNNER_TEMP/OptimizerUnitFailureTest.php" <<'EOF'
          <?php
          final class OptimizerUnitFailureTest extends PHPUnit\Framework\TestCase {
              public function test_intentional_failure(): void {
                  $this->assertTrue(false, 'Optimizer unit assertion control');
              }
          }
          EOF
          if vendor/bin/phpunit --no-configuration --do-not-cache-result "$RUNNER_TEMP/OptimizerUnitFailureTest.php" > "$RUNNER_TEMP/optimizer-unit-failure.txt" 2>&1; then
            echo '::error::An intentionally failing unit assertion succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'Optimizer unit assertion control' "$RUNNER_TEMP/optimizer-unit-failure.txt"
          fi
          echo 'Unit nonempty and assertion-failure controls passed.' > "$RUNNER_TEMP/es-optimizer-diagnostics/unit-controls.txt"

      - name: Pin PHPUnit for WordPress test suite
        id: pin_phpunit_for_wordpress_test_suite
        run: |
          # The WordPress test library still calls PHPUnit APIs removed in PHPUnit 10+.
          # Keep this generated integration-test job on PHPUnit 9.6 while the rest
          # of the project can continue using newer Composer-resolved QA tooling.
          if [ "${{ matrix.dependency-versions }}" = "lowest" ]; then
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --prefer-lowest --no-progress
          else
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --no-progress
          fi

      - name: Verify PHPUnit dependency versions
        id: verify_phpunit_dependency_versions
        run: |
          composer show phpunit/phpunit
          composer show yoast/phpunit-polyfills
          vendor/bin/phpunit --version | grep -E '^PHPUnit 9\.6\.'

      - name: Prepare Database
        id: prepare_database
        run: |
          mysql -u root --password=root --host=127.0.0.1 --port=3306 -e "DROP DATABASE IF EXISTS wordpress_test;"
          mysqladmin -u root --password=root --host=127.0.0.1 --port=3306 --force create wordpress_test

      - name: Create tests directory structure
        id: create_tests_directory_structure
        run: |
          mkdir -p tests/bin
          mkdir -p tests/bootstrap

      - name: Create WP tests install script
        id: create_wp_tests_install_script
        run: |
          cat > tests/bin/install-wp-tests.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          set +x
          umask 077

          if [ $# -lt 3 ]; then
            echo "usage: $0 <db-name> <db-user> <db-pass> [db-host] [wp-version] [skip-database-creation]"
            exit 1
          fi

          DB_NAME=$1
          DB_USER=$2
          DB_PASS=$3
          DB_HOST=${4-localhost}
          WP_VERSION=${5-latest}
          SKIP_DB_CREATE=${6-false}

          WP_TESTS_DIR=${WP_TESTS_DIR-/tmp/wordpress-tests-lib}
          WP_CORE_DIR=${WP_CORE_DIR-/tmp/wordpress/}

          # Only the isolated GitHub service database is in scope.
          [[ $DB_NAME == wordpress_test && $DB_HOST == 127.0.0.1:3306 ]]
          [[ $SKIP_DB_CREATE == true || $SKIP_DB_CREATE == false ]]

          download() {
              curl --fail --silent --show-error --location \
                  --proto '=https' --proto-redir '=https' \
                  --connect-timeout 20 --max-time 180 --retry 3 \
                  "$1" --output "$2"
              test -s "$2"
          }

          if [[ $WP_VERSION == latest ]]; then
              download https://api.wordpress.org/core/version-check/1.7/ /tmp/wp-latest.json
              WP_VERSION=$(php -r '
                  $data = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
                  $versions = [];
                  foreach ($data["offers"] ?? [] as $offer) {
                      if (($offer["response"] ?? null) !== "upgrade") {
                          continue;
                      }
                      $version = $offer["current"] ?? null;
                      if (!is_string($version) || !preg_match("/\A[0-9]+\.[0-9]+(?:\.[0-9]+)?\z/", $version)) {
                          throw new RuntimeException("Invalid stable WordPress offer.");
                      }
                      $versions[$version] = true;
                  }
                  if (count($versions) !== 1) {
                      throw new RuntimeException("Expected exactly one stable WordPress release.");
                  }
                  echo array_key_first($versions);
              ' /tmp/wp-latest.json)
          fi

          if [[ $WP_VERSION =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              WP_TESTS_TAG="tags/$WP_VERSION"
          elif [[ $WP_VERSION == nightly || $WP_VERSION == trunk ]]; then
              WP_TESTS_TAG=trunk
          else
              echo "Invalid WordPress version selector" >&2
              exit 1
          fi
          WP_SOURCE_URL="https://develop.svn.wordpress.org/$WP_TESTS_TAG"
          WP_REVISION=$(svn info --non-interactive --show-item revision "$WP_SOURCE_URL")
          [[ $WP_REVISION =~ ^[0-9]+$ ]]

          install_wp() {
              # Do not silently reuse a partial install.
              [[ ! -e $WP_CORE_DIR && ! -L $WP_CORE_DIR ]]
              if [[ $WP_TESTS_TAG == trunk ]]; then
                  # Nightly core and test fixtures use one immutable SVN snapshot.
                  svn export --non-interactive --quiet -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/src@$WP_REVISION" "$WP_CORE_DIR"
              else
                  mkdir -p "$WP_CORE_DIR"
                  download "https://wordpress.org/wordpress-$WP_VERSION.tar.gz" /tmp/wordpress.tar.gz
                  tar --strip-components=1 -zxf /tmp/wordpress.tar.gz -C "$WP_CORE_DIR"
              fi

              # setup-php supplies native mysqli; never fetch a mutable third-party db.php.
              php -r 'exit(extension_loaded("mysqli") ? 0 : 1);'
              test ! -e "$WP_CORE_DIR/wp-content/db.php"
              CORE_VERSION=$(php -r 'require $argv[1]; echo $wp_version;' "$WP_CORE_DIR/wp-includes/version.php")
              SOURCE_VERSION=$(svn cat --non-interactive -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/src/wp-includes/version.php@$WP_REVISION" |
                  php -r '$source = stream_get_contents(STDIN); if (!preg_match("/\\\$wp_version\s*=\s*\x27([^\x27]+)\x27/", $source, $match)) { exit(1); } echo $match[1];')
              [[ ${CORE_VERSION%-src} == "${SOURCE_VERSION%-src}" ]]
              if [[ $WP_TESTS_TAG != trunk ]]; then
                  [[ ${CORE_VERSION%-src} == "$WP_VERSION" ]]
              fi
              mkdir -p "$RUNNER_TEMP/es-optimizer-diagnostics"
              printf 'core=%s\nsource=%s\nrevision=%s\n' "$CORE_VERSION" "$WP_TESTS_TAG" "$WP_REVISION" \
                  > "$RUNNER_TEMP/es-optimizer-diagnostics/wordpress.txt"
          }

          install_test_suite() {
              [[ ! -e $WP_TESTS_DIR && ! -L $WP_TESTS_DIR ]]
              mkdir -p "$WP_TESTS_DIR"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/includes@$WP_REVISION" "$WP_TESTS_DIR/includes"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/data@$WP_REVISION" "$WP_TESTS_DIR/data"

              if [ ! -f "$WP_TESTS_DIR/wp-tests-config.php" ]; then
                  svn cat --non-interactive -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/wp-tests-config-sample.php@$WP_REVISION" \
                      > "$WP_TESTS_DIR/wp-tests-config.php"
                  export WP_TESTS_DIR WP_CORE_DIR DB_NAME DB_USER DB_PASS DB_HOST
                  # Quote PHP literals safely; do not interpolate credentials through sed.
                  php -r '
                      $path = getenv("WP_TESTS_DIR") . "/wp-tests-config.php";
                      $config = file_get_contents($path);
                      $replacements = [
                          "dirname( __FILE__ ) . \x27/src/\x27" => rtrim(getenv("WP_CORE_DIR"), "/") . "/",
                          "\x27youremptytestdbnamehere\x27" => getenv("DB_NAME"),
                          "\x27yourusernamehere\x27" => getenv("DB_USER"),
                          "\x27yourpasswordhere\x27" => getenv("DB_PASS"),
                          "\x27localhost\x27" => getenv("DB_HOST"),
                      ];
                      foreach ($replacements as $needle => $value) {
                          if (substr_count($config, $needle) !== 1) {
                              throw new RuntimeException("Unexpected WordPress test config template.");
                          }
                          $config = str_replace($needle, var_export($value, true), $config);
                      }
                      if (file_put_contents($path, $config) !== strlen($config)) {
                          throw new RuntimeException("Cannot write WordPress test config.");
                      }
                  '
              fi
          }

          install_db() {
              if [[ $SKIP_DB_CREATE == true ]]; then
                  return
              fi
              # Fallback is limited to this job's disposable service and never drops a DB.
              MYSQL_PWD="$DB_PASS" mysql --user="$DB_USER" --host=127.0.0.1 --port=3306 \
                  -e 'CREATE DATABASE wordpress_test'
          }

          install_wp
          install_test_suite
          install_db
          EOF
          chmod +x tests/bin/install-wp-tests.sh

      - name: Create Bootstrap File
        id: create_bootstrap_file
        run: |
          mkdir -p tests
          cat > tests/bootstrap.php << 'EOF'
          <?php
          /** Native bootstrap generated on the runner; no workstation doubles. */
          if ('true' !== getenv('GITHUB_ACTIONS')) {
              throw new RuntimeException('Native tests require the isolated GitHub runner.');
          }
          define('WP_TESTS_PHPUNIT_POLYFILLS_PATH', dirname(__DIR__) . '/vendor/yoast/phpunit-polyfills');
          require_once '/tmp/wordpress-tests-lib/includes/functions.php';
          tests_add_filter('muplugins_loaded', static function () {
              require dirname(__DIR__) . '/enginescript-site-optimizer.php';
          });
          require '/tmp/wordpress-tests-lib/includes/bootstrap.php';
          // Load the exact uninstall entry once on the empty disposable installation.
          // Later helper tests cover DB/cache/failure semantics, not core file deletion.
          define('WP_UNINSTALL_PLUGIN', 'enginescript-site-optimizer/enginescript-site-optimizer.php');
          require dirname(__DIR__) . '/uninstall.php';
          EOF

      - name: Create Test File
        id: create_test_file
        run: |
          cat > tests/EngineScriptSiteOptimizerTest.php << 'EOF'
          <?php
          /** Native WordPress regression cases; generated and run only on fresh CI runners. */
          final class EngineScriptSiteOptimizerTest extends WP_UnitTestCase {
              /**
               * Reset native state for each regression.
               *
               * @since Unreleased
               * @return void
               */
              public function set_up() {
                  parent::set_up();
                  require_once ABSPATH . 'wp-admin/includes/plugin.php';
                  require_once ABSPATH . 'wp-admin/includes/template.php';
                  wp_set_current_user(0);
                  delete_option('es_optimizer_options');
                  delete_transient('settings_errors');
                  $GLOBALS['wp_settings_errors'] = array();
                  es_optimizer_init_settings();
              }

              /** Store a legacy fixture without changing production sanitization. */
              private function legacy_options(array $options): void {
                  remove_filter('sanitize_option_es_optimizer_options', 'es_optimizer_validate_options');
                  try {
                      update_option('es_optimizer_options', $options);
                  } finally {
                      add_filter('sanitize_option_es_optimizer_options', 'es_optimizer_validate_options');
                  }
              }

              /** Inspect the physical row separately from core default/notoptions caches. */
              private function option_rows(): int {
                  global $wpdb;
                  return (int) $wpdb->get_var($wpdb->prepare(
                      'SELECT COUNT(*) FROM %i WHERE option_name = %s', $wpdb->options, 'es_optimizer_options'
                  ));
              }

              /**
               * Require the dedicated multisite invocation.
               *
               * @since Unreleased
               * @return void
               */
              private function require_multisite(): void {
                  if (!is_multisite()) {
                      $this->markTestSkipped('Executed by the separate multisite invocation in this same matrix cell.');
                  }
              }

              /**
               * Native bootstrap mode and optimizer hooks.
               *
               * @since Unreleased
               * @return void
               */
              public function test_native_bootstrap_mode_and_optimizer_hooks(): void {
                  $this->assertSame('1' === getenv('WP_MULTISITE'), is_multisite());
                  $this->assertSame(get_plugin_data(ES_SITE_OPTIMIZER_FILE, false, false)['Version'], ES_SITE_OPTIMIZER_VERSION);
                  $this->assertSame(10, has_filter('wp_resource_hints', 'es_optimizer_add_preconnect_resource_hints'));
                  $this->assertSame(10, has_filter('tiny_mce_plugins', 'es_optimizer_disable_emojis_tinymce'));
                  $this->assertCount(13, es_optimizer_get_settings_fields());
                  $this->assertCount(11, es_optimizer_get_boolean_option_keys());
              }

              /**
               * Virtual defaults activation and deactivation.
               *
               * @since Unreleased
               * @return void
               */
              public function test_virtual_defaults_activation_and_deactivation(): void {
                  es_optimizer_activate_plugin(is_multisite());
                  $this->assertSame(es_optimizer_get_default_options(), es_optimizer_get_options());
                  $this->assertSame(0, $this->option_rows());
                  $this->assertFalse(update_option('es_optimizer_options', es_optimizer_get_default_options()));
                  $this->assertSame(0, $this->option_rows());
                  $saved = array_merge(es_optimizer_get_default_options(), array('preconnect_domains' => 'https://saved.example.com'));
                  update_option('es_optimizer_options', $saved);
                  es_optimizer_deactivate_plugin(is_multisite());
                  $this->assertSame($saved, get_option('es_optimizer_options'));
                  $this->assertSame(1, $this->option_rows());
              }

              /**
               * Native add update delete without manual refresh.
               *
               * @since Unreleased
               * @return void
               */
              public function test_native_add_update_delete_without_manual_refresh(): void {
                  $this->assertSame(0, $this->option_rows());
                  $saved = array_merge(es_optimizer_get_default_options(), array('preconnect_domains' => 'https://first.example.com'));
                  $this->assertTrue(add_option('es_optimizer_options', $saved));
                  $this->assertSame($saved, es_optimizer_get_options());
                  $saved['preconnect_domains'] = 'https://second.example.com';
                  $this->assertTrue(update_option('es_optimizer_options', $saved));
                  $this->assertSame($saved, es_optimizer_get_options());
                  delete_option('es_optimizer_options');
                  $this->assertSame(es_optimizer_get_default_options(), es_optimizer_get_options());
                  $this->assertSame(0, $this->option_rows());
              }

              /**
               * Setting registration and rest exclusion.
               *
               * @since Unreleased
               * @return void
               */
              public function test_setting_registration_and_rest_exclusion(): void {
                  $setting = get_registered_settings()['es_optimizer_options'];
                  $this->assertSame('es_optimizer_settings', $setting['group']);
                  $this->assertSame('es_optimizer_validate_options', $setting['sanitize_callback']);
                  $this->assertFalse($setting['show_in_rest']);
                  $controller = new WP_REST_Settings_Controller();
                  $this->assertArrayNotHasKey('es_optimizer_options', $controller->get_item_schema()['properties']);
              }

              /**
               * Native first insert safe notice and blank save.
               *
               * @since Unreleased
               * @return void
               */
              public function test_native_first_insert_safe_notice_and_blank_save(): void {
                  $saved = array('preconnect_domains' => "https://user:synthetic-token@example.com\nhttps://ok.example.com");
                  $this->assertTrue(update_option('es_optimizer_options', $saved));
                  $this->assertSame('https://ok.example.com', get_option('es_optimizer_options')['preconnect_domains']);
                  $warnings = get_settings_errors('es_optimizer_options');
                  $this->assertCount(1, $warnings);
                  $this->assertStringNotContainsString('synthetic-token', serialize($warnings));
                  $this->assertStringNotContainsString('user:', serialize($warnings));
                  update_option('es_optimizer_options', array('preconnect_domains' => ''));
                  $this->assertSame('', get_option('es_optimizer_options')['preconnect_domains']);
              }

              /**
               * Native invalid fields and budgets preserve prior field.
               *
               * @since Unreleased
               * @return void
               */
              public function test_native_invalid_fields_and_budgets_preserve_prior_field(): void {
                  foreach (array('preconnect_domains' => 'dns_prefetch_domains', 'dns_prefetch_domains' => 'preconnect_domains') as $field => $other) {
                      update_option('es_optimizer_options', array($field => 'https://prior.example.com'));
                      foreach (array(array(), new stdClass(), null, 12, false, str_repeat('x', 32769), str_pad('https://example.com', 513), implode("\n", array_fill(0, 101, 'https://example.com'))) as $invalid) {
                          update_option('es_optimizer_options', array($field => $invalid, $other => 'https://valid.example.com'));
                          $this->assertSame('https://prior.example.com', get_option('es_optimizer_options')[$field]);
                          $this->assertSame('https://valid.example.com', get_option('es_optimizer_options')[$other]);
                      }
                  }
              }

              /**
               * Raw boundary and canonical origin cases.
               *
               * @since Unreleased
               * @return void
               */
              public function test_raw_boundary_and_canonical_origin_cases(): void {
                  foreach (array('https://exa%6dple.com', "https://exa\tmple.com", 'https://example.com\\token', 'https://example.com?synthetic-token', 'https://example.com/path', 'https://127.0.0.1') as $raw) {
                      $result = es_optimizer_validate_single_domain($raw);
                      $this->assertFalse($result['valid']);
                      $this->assertSame('', $result['domain']);
                      $this->assertStringNotContainsString($raw, $result['error']);
                  }
                  $this->assertSame('https://example.com', es_optimizer_validate_single_domain('https://EXAMPLE.COM:443/')['domain']);
                  $this->assertFalse(es_optimizer_validate_domain_for_context('https://example.com:8443', 'preconnect')['valid']);
                  $this->assertTrue(es_optimizer_validate_domain_for_context('https://example.com:8443', 'dns_prefetch')['valid']);
                  $this->assertSame('', es_optimizer_get_domain_list_budget_error(str_pad('https://example.com', 512)));
                  $this->assertNotSame('', es_optimizer_get_domain_list_budget_error(str_pad('https://example.com', 513)));
                  $this->assertSame('', es_optimizer_get_domain_list_budget_error(str_repeat(' ', 32768)));
                  $this->assertNotSame('', es_optimizer_get_domain_list_budget_error(str_repeat(' ', 32769)));
                  $this->assertSame('', es_optimizer_get_domain_list_budget_error(implode("\r\n", array_fill(0, 100, 'https://example.com'))));
              }

              /**
               * Notice storage dedup and foreign success.
               *
               * @since Unreleased
               * @return void
               */
              public function test_notice_storage_dedup_and_foreign_success(): void {
                  add_settings_error('foreign', 'saved', 'Other settings saved.', 'success');
                  $input = implode("\n", array_fill(0, 4, 'https://user:synthetic-token@example.com'));
                  es_optimizer_validate_domain_list($input, 'preconnect');
                  es_optimizer_validate_domain_list($input, 'preconnect');
                  $warnings = get_settings_errors();
                  $this->assertCount(2, $warnings);
                  set_transient('settings_errors', $warnings, 30);
                  $this->assertSame($warnings, get_transient('settings_errors'));
                  $this->assertStringNotContainsString('synthetic-token', serialize(get_transient('settings_errors')));
                  $this->assertStringContainsString('4 lines were rejected.', $warnings[1]['message']);
                  $this->assertStringNotContainsString('Line 4:', $warnings[1]['message']);
                  ob_start();
                  settings_errors();
                  $html = ob_get_clean();
                  $this->assertSame(1, substr_count($html, 'id="setting-error-preconnect_security"'));
                  $this->assertStringContainsString('Other settings saved.', $html);
              }

              /**
               * Settings page capability and native form contract.
               *
               * @since Unreleased
               * @return void
               */
              public function test_settings_page_capability_and_native_form_contract(): void {
                  $subscriber = self::factory()->user->create(array('role' => 'subscriber'));
                  wp_set_current_user($subscriber);
                  try {
                      es_optimizer_settings_page();
                      $this->fail('Subscriber rendered settings.');
                  } catch (WPDieException $error) {
                      $this->assertStringContainsString('permissions', $error->getMessage());
                  }
                  wp_set_current_user(self::factory()->user->create(array('role' => 'administrator')));
                  ob_start();
                  es_optimizer_settings_page();
                  $html = ob_get_clean();
                  $dom = new DOMDocument();
                  $previous = libxml_use_internal_errors(true);
                  try {
                      $this->assertTrue($dom->loadHTML($html));
                  } finally {
                      libxml_clear_errors();
                      libxml_use_internal_errors($previous);
                  }
                  $xpath = new DOMXPath($dom);
                  $this->assertSame(1, $xpath->query('//form[@method="post" and @action="options.php"]')->length);
                  $this->assertSame('es_optimizer_settings', $xpath->query('//input[@name="option_page"]')->item(0)->getAttribute('value'));
                  $nonce = $xpath->query('//input[@name="_wpnonce"]')->item(0)->getAttribute('value');
                  $this->assertNotFalse(wp_verify_nonce($nonce, 'es_optimizer_settings-options'));
                  $this->assertFalse(wp_verify_nonce($nonce, 'another-group-options'));
                  foreach (array('preconnect_domains', 'dns_prefetch_domains') as $field) {
                      $id = 'es_optimizer_field_' . $field;
                      $this->assertSame(1, $xpath->query('//textarea[@id="' . $id . '" and @aria-describedby="' . $id . '_description"]')->length);
                      $this->assertSame(1, $xpath->query('//*[@id="' . $id . '_description"]')->length);
                      $this->assertSame(1, $xpath->query('//label[@for="' . $id . '"]')->length);
                  }
              }

              /**
               * Core emitted hint html and legacy preservation.
               *
               * @since Unreleased
               * @return void
               */
              public function test_core_emitted_hint_html_and_legacy_preservation(): void {
                  $saved = array_merge(es_optimizer_get_default_options(), array(
                      'enable_preconnect' => 1, 'preconnect_domains' => "https://fonts.gstatic.com\nhttps://custom.example.com:8443\nhttps://ok.example.com:443",
                      'enable_dns_prefetch' => 1, 'dns_prefetch_domains' => 'https://dns.example.com:8443'
                  ));
                  $this->legacy_options($saved);
                  ob_start();
                  wp_resource_hints();
                  $html = ob_get_clean();
                  $this->assertStringContainsString('https://fonts.gstatic.com', $html);
                  $this->assertStringContainsString('crossorigin=', $html);
                  $this->assertStringContainsString('https://ok.example.com', $html);
                  $this->assertStringContainsString('//dns.example.com', $html);
                  $this->assertStringNotContainsString('custom.example.com', $html);
                  $this->assertStringNotContainsString(':8443', $html);
                  $this->assertSame($saved, get_option('es_optimizer_options'));
              }

              /**
