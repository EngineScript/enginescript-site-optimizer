              /**
               * Site cursor pages are physical and bounded.
               *
               * @since Unreleased
               * @return void
               */
              public function test_site_cursor_pages_are_physical_and_bounded(): void {
                  $this->require_multisite();
                  global $wpdb;
                  $last = es_optimizer_uninstall_get_site_limit();
                  // Directory-only fixtures test enumeration, not deployment-scale deletion.
                  for ($i = 1; $i <= 101; ++$i) {
                      $this->assertNotFalse($wpdb->insert($wpdb->blogs, array(
                          'blog_id' => $last + $i, 'site_id' => 1, 'domain' => 'cursor-' . $i . '.example.com', 'path' => '/',
                          'registered' => '2026-01-01 00:00:00', 'last_updated' => '2026-01-01 00:00:00'
                      )));
                  }
                  $maximum = es_optimizer_uninstall_get_site_limit();
                  $queries = $wpdb->num_queries;
                  $page = es_optimizer_uninstall_get_site_ids($last, $maximum);
                  $this->assertSame(1, $wpdb->num_queries - $queries);
                  $this->assertCount(100, $page);
                  $this->assertSame(range($last + 1, $last + 100), $page);
                  $this->assertSame(array($last + 101), es_optimizer_uninstall_get_site_ids(end($page), $maximum));
                  $this->assertSame(array(), es_optimizer_uninstall_get_site_ids($maximum, $maximum));
              }

              /**
               * Measured hint callback budget.
               *
               * @since Unreleased
               * @return void
               */
              public function test_measured_hint_callback_budget(): void {
                  $measurements = array();
                  foreach (array(1, 10, 100) as $candidates) {
                      $domains = array();
                      for ($i = 0; $i < $candidates; ++$i) {
                          $domains[] = 'https://candidate-' . $i . '.example.com';
                      }
                      update_option('es_optimizer_options', array('enable_preconnect' => 1, 'preconnect_domains' => implode("\n", $domains)));
                      $medians = array();
                      foreach (array(0, 1000, 10000) as $count) {
                          $samples = array();
                          $peak_bytes = 0;
                          for ($iteration = 0; $iteration < 25; ++$iteration) {
                              $foreign = array();
                              for ($i = 0; $i < $count; ++$i) {
                                  $foreign[] = 'https://foreign-' . $i . '.example.com';
                              }
                              memory_reset_peak_usage();
                              $before_memory = memory_get_usage(true);
                              $start = hrtime(true);
                              $result = es_optimizer_add_preconnect_resource_hints($foreign, 'preconnect');
                              $elapsed = (hrtime(true) - $start) / 1e9;
                              $extra_peak = memory_get_peak_usage(true) - $before_memory;
                              $this->assertCount($count + $candidates, $result);
                              $this->assertSame($foreign, array_slice($result, 0, $count));
                              $this->assertLessThanOrEqual(32 * 1024 * 1024, $extra_peak);
                              if ($iteration >= 5) {
                                  $samples[] = $elapsed;
                                  $peak_bytes = max($peak_bytes, $extra_peak);
                              }
                              unset($foreign, $result);
                          }
                          sort($samples);
                          $medians[$count] = ($samples[9] + $samples[10]) / 2;
                          $measurements[$candidates][$count] = array('median_seconds' => $medians[$count], 'peak_additional_bytes' => $peak_bytes);
                      }
                      $this->assertLessThanOrEqual(1.0, $medians[10000]);
                      $this->assertLessThanOrEqual(max(20 * $medians[1000], 0.1), $medians[10000]);
                  }
                  $file = getenv('RUNNER_TEMP') . '/es-optimizer-diagnostics/hint-timing-' . (is_multisite() ? 'multisite' : 'single') . '.json';
                  $this->assertNotFalse(file_put_contents($file, wp_json_encode(array('measurements' => $measurements, 'warmups' => 5, 'samples' => 20, 'scope' => 'callback only; not deployment SLA'))));
              }
          }
          EOF
          php -l tests/EngineScriptSiteOptimizerTest.php
          php -l tests/bootstrap.php

      - name: Create PHPUnit Config
        id: create_phpunit_config
        run: |
          cat > phpunit.xml << 'EOF'
          <?xml version="1.0"?>
          <phpunit bootstrap="tests/bootstrap.php" backupGlobals="false" colors="true"
              failOnEmptyTestSuite="true" failOnRisky="true" failOnWarning="true">
              <testsuites>
                  <testsuite name="EngineScript Site Optimizer native">
                      <file>tests/EngineScriptSiteOptimizerTest.php</file>
                  </testsuite>
              </testsuites>
          </phpunit>
          EOF

      - name: Setup WP Tests
        id: setup_wp_tests
        timeout-minutes: 15
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp-version }} true

      - name: Run plugin test
        id: run_plugin_test
        run: |
          mkdir -p "$RUNNER_TEMP/es-optimizer-diagnostics"
          WP_MULTISITE=0 vendor/bin/phpunit --config phpunit.xml --log-junit "$RUNNER_TEMP/es-optimizer-diagnostics/junit.xml"
          WP_MULTISITE=1 vendor/bin/phpunit --config phpunit.xml --log-junit "$RUNNER_TEMP/es-optimizer-diagnostics/multisite-junit.xml"
          # Prove that the real generated config rejects an empty filtered suite.
          if vendor/bin/phpunit --config phpunit.xml --do-not-cache-result \
            --filter '__es_optimizer_intentionally_no_matching_test__' \
            > "$RUNNER_TEMP/es-optimizer-empty-suite.txt" 2>&1; then
            echo '::error::An empty test suite incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'No tests executed' "$RUNNER_TEMP/es-optimizer-empty-suite.txt"
          fi
          # This control must fail due to its assertion, not a setup/parse error.
          cat > "$RUNNER_TEMP/OptimizerIntentionalFailureTest.php" << 'EOF'
          <?php
          final class OptimizerIntentionalFailureTest extends PHPUnit\Framework\TestCase {
              public function test_intentional_failure(): void {
                  $this->assertTrue(false, 'Optimizer intentional assertion control');
              }
          }
          EOF
          if vendor/bin/phpunit --no-configuration --do-not-cache-result \
            "$RUNNER_TEMP/OptimizerIntentionalFailureTest.php" \
            > "$RUNNER_TEMP/es-optimizer-failing-suite.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'Optimizer intentional assertion control' "$RUNNER_TEMP/es-optimizer-failing-suite.txt"
          fi
          echo 'Empty-suite and intentional-assertion controls failed as expected.' | tee "$RUNNER_TEMP/es-optimizer-diagnostics/native-controls.txt"

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            use_isolated_composer_auth=${{ steps.use_isolated_composer_auth.outcome }}
            php_syntax_lint=${{ steps.php_syntax_lint.outcome }}
            install_subversion=${{ steps.install_subversion.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            run_isolated_unit_tests=${{ steps.run_isolated_unit_tests.outcome }}
            pin_phpunit_for_wordpress_test_suite=${{ steps.pin_phpunit_for_wordpress_test_suite.outcome }}
            verify_phpunit_dependency_versions=${{ steps.verify_phpunit_dependency_versions.outcome }}
            prepare_database=${{ steps.prepare_database.outcome }}
            create_tests_directory_structure=${{ steps.create_tests_directory_structure.outcome }}
            create_wp_tests_install_script=${{ steps.create_wp_tests_install_script.outcome }}
            create_bootstrap_file=${{ steps.create_bootstrap_file.outcome }}
            create_test_file=${{ steps.create_test_file.outcome }}
            create_phpunit_config=${{ steps.create_phpunit_config.outcome }}
            setup_wp_tests=${{ steps.setup_wp_tests.outcome }}
            run_plugin_test=${{ steps.run_plugin_test.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/es-optimizer-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/es-optimizer-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/es-optimizer-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/es-optimizer-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/es-optimizer-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/es-optimizer-diagnostics" -type l -delete
          find "$RUNNER_TEMP/es-optimizer-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-${{ matrix.php-version }}-${{ matrix.wp-version }}-${{ matrix.dependency-versions }}
          path: |
            ${{ runner.temp }}/es-optimizer-diagnostics/run.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/steps.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/php.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/dependencies.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/wordpress.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/junit.xml
            ${{ runner.temp }}/es-optimizer-diagnostics/unit-junit.xml
            ${{ runner.temp }}/es-optimizer-diagnostics/multisite-junit.xml
            ${{ runner.temp }}/es-optimizer-diagnostics/unit-dependencies.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/unit-controls.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/native-controls.txt
            ${{ runner.temp }}/es-optimizer-diagnostics/hint-timing-single.json
            ${{ runner.temp }}/es-optimizer-diagnostics/hint-timing-multisite.json
          retention-days: 7
          if-no-files-found: warn

      - name: Report test status
        id: report_test_status
        if: ${{ always() }}
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Tests passed successfully on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          else
            echo "❌ Tests failed on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          fi

      - name: Ensure repository files available after failure
        id: ensure_repository_files_available_after_failure
        if: ${{ failure() }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create issue on test failure
        id: create_issue_on_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.use_isolated_composer_auth.outcome == 'failure' && 'use_isolated_composer_auth' || steps.php_syntax_lint.outcome == 'failure' && 'php_syntax_lint' || steps.install_subversion.outcome == 'failure' && 'install_subversion' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.run_isolated_unit_tests.outcome == 'failure' && 'run_isolated_unit_tests' || steps.pin_phpunit_for_wordpress_test_suite.outcome == 'failure' && 'pin_phpunit_for_wordpress_test_suite' || steps.verify_phpunit_dependency_versions.outcome == 'failure' && 'verify_phpunit_dependency_versions' || steps.prepare_database.outcome == 'failure' && 'prepare_database' || steps.create_tests_directory_structure.outcome == 'failure' && 'create_tests_directory_structure' || steps.create_wp_tests_install_script.outcome == 'failure' && 'create_wp_tests_install_script' || steps.create_bootstrap_file.outcome == 'failure' && 'create_bootstrap_file' || steps.create_test_file.outcome == 'failure' && 'create_test_file' || steps.create_phpunit_config.outcome == 'failure' && 'create_phpunit_config' || steps.setup_wp_tests.outcome == 'failure' && 'setup_wp_tests' || steps.run_plugin_test.outcome == 'failure' && 'run_plugin_test' || steps.report_test_status.outcome == 'failure' && 'report_test_status' || steps.ensure_repository_files_available_after_failure.outcome == 'failure' && 'ensure_repository_files_available_after_failure' || 'unknown_or_canceled' }}
          PHP_VERSION: ${{ matrix.php-version }}
          WP_VERSION: ${{ matrix.wp-version }}
          DEPENDENCY_VERSIONS: ${{ matrix.dependency-versions }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/wp-version-test-failure.md
          update_existing: false
