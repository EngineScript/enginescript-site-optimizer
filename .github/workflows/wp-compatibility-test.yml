               *
               * @since Unreleased
               * @return void
               */
              public function test_oversize_legacy_read_and_retired_key(): void {
                  $saved = array_merge(es_optimizer_get_default_options(), array('enable_preconnect' => 1, 'preconnect_domains' => str_repeat('x', 32769), 'remove_wlw_manifest' => 1));
                  $this->legacy_options($saved);
                  $this->assertSame(array(), es_optimizer_add_preconnect_resource_hints(array(), 'preconnect'));
                  $this->assertArrayNotHasKey('remove_wlw_manifest', es_optimizer_get_options());
                  $this->assertSame($saved, get_option('es_optimizer_options'));
