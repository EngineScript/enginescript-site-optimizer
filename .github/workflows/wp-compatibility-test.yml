                  $foreign = array('kept' => array('href' => 'https://example.com', 'crossorigin' => 'use-credentials'), null, 10, array('href' => new stdClass()));
                  $this->assertSame($foreign, es_optimizer_add_preconnect_resource_hints($foreign, 'preconnect'));
                  $one = es_optimizer_add_preconnect_resource_hints(array(), 'preconnect');
