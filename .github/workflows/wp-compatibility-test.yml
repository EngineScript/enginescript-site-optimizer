              /**
               * Uninstall stale notoptions cannot prove absence.
               *
               * @since Unreleased
               * @return void
               */
              public function test_uninstall_stale_notoptions_cannot_prove_absence(): void {
                  global $wpdb;
                  update_option('es_optimizer_options', array('preconnect_domains' => 'https://saved.example.com'));
                  // A hook can restore the physical row after core has marked it absent.
                  $reinsert = static function () use ($wpdb) {
                      $wpdb->insert($wpdb->options, array('option_name' => 'es_optimizer_options', 'option_value' => 'fixture', 'autoload' => 'no'));
                  };
                  add_action('delete_option_es_optimizer_options', $reinsert);
                  try {
                      es_optimizer_uninstall_current_site_options();
                      $this->fail('Physical row survived but cleanup succeeded.');
                  } catch (RuntimeException $error) {
                      $this->assertSame(1, $this->option_rows());
                      $this->assertTrue(wp_cache_get('notoptions', 'options')['es_optimizer_options']);
                  } finally {
                      remove_action('delete_option_es_optimizer_options', $reinsert);
                      wp_cache_delete('notoptions', 'options');
                  }
                  es_optimizer_uninstall_current_site_options();
                  $this->assertSame(0, $this->option_rows());
              }

              /**
               * Uninstall failed delete detected and suppression restored.
               *
               * @since Unreleased
               * @return void
               */
              public function test_uninstall_failed_delete_detected_and_suppression_restored(): void {
                  global $wpdb;
                  update_option('es_optimizer_options', array('preconnect_domains' => 'https://saved.example.com'));
                  $was_suppressed = $wpdb->suppress_errors;
                  $failure = static function ($query) {
                      if (str_starts_with($query, 'DELETE FROM') && str_contains($query, 'es_optimizer_options')) {
                          return 'SELECT * FROM optimizer_intentionally_missing_table';
                      }
                      return $query;
                  };
                  add_filter('query', $failure);
                  try {
                      es_optimizer_uninstall_options();
                      $this->fail('Failed DELETE was accepted.');
                  } catch (RuntimeException $error) {
                      $this->assertSame(1, $this->option_rows());
                      $this->assertSame($was_suppressed, $wpdb->suppress_errors);
                      $this->assertTrue(wp_cache_get('notoptions', 'options')['es_optimizer_options']);
                  } finally {
                      remove_filter('query', $failure);
                      wp_cache_delete('notoptions', 'options');
                  }
                  es_optimizer_uninstall_options();
                  $this->assertSame(0, $this->option_rows());
              }

